{% extends "base.html" %}
{% block title %}Sign in &mdash; Pomb{% endblock %}
{% block content %}
<main class="login-page">
  <div class="login-card">
    <h1>&#127813; Pomb</h1>
    <p class="login-error" id="passkey-error" hidden></p>
    <button type="button" class="btn btn-primary btn-block" id="passkey-sign-in">Sign in with a passkey</button>
    {% if recovery %}<p class="setup-intro"><a href="/recover">Lost every passkey? Recover your account</a></p>{% endif %}
  </div>
</main>
<script src="/static/passkey.js"></script>
<script>
(function () {
  var button = document.getElementById('passkey-sign-in');
  var error = document.getElementById('passkey-error');
  button.addEventListener('click', function () {
    button.disabled = true;
    window.pombPasskey.attempt(error, 'Sign-in failed: ', function () {
      return window.pombPasskey.signIn().then(function (done) { location.assign(done.redirect); });
    }).then(function (signedIn) { button.disabled = signedIn; });
  });
})();
</script>
{% endblock %}
