<!-- Edit time entry dialog (v3-01841) -->
<div id="edit-entry-overlay" class="dlg-overlay" hidden>
  <div class="dlg" role="dialog" aria-label="Edit time entry">
    <div class="dlg-title">Edit Pomodoro entry</div>
    <p class="dlg-inline-error" id="ee-error" hidden></p>
    <div class="dlg-row">
      <div class="dlg-field">
        <span>Date <span id="ee-date-ok" class="dlg-date-ok" title="Valid date">&#10003;</span></span>
        <div class="mt-date-wrap">
          <input type="text" id="ee-date" readonly>
          <button type="button" id="ee-cal-btn" aria-label="Pick a date">&#128197;</button>
        </div>
      </div>
    </div>
    <label class="dlg-field">
      <span>Task</span>
      <input type="text" id="ee-task" list="mt-task-list" autocomplete="off">
    </label>
    <div class="dlg-row">
      <label class="dlg-field"><span>From</span><input type="time" id="ee-from" step="1"></label>
      <label class="dlg-field"><span>To</span><input type="time" id="ee-to" step="1"></label>
      <div class="dlg-field"><span>Duration</span><div id="ee-duration" class="mt-duration">0h</div></div>
    </div>
    <!-- KF-271: KanbanFlow has "Add labels" / "Add comment" checkboxes that
         expand their inputs (GM-082/GM-084), not text-link toggles.
         Labels pair first: the master shows the expanded Labels input
         with "Add comment" below it (v3 e017). -->
    <label class="check-label"><input type="checkbox" id="ee-labels-check"> Add labels</label>
    <div id="ee-labels" class="dlg-labels" hidden>
      <input type="text" id="ee-labels-input" list="ee-labels-datalist" placeholder="Type a label and press Enter..." autocomplete="off" maxlength="50">
      <datalist id="ee-labels-datalist"></datalist>
      <div id="ee-labels-list" class="labels-list"></div>
    </div>
    <label class="check-label"><input type="checkbox" id="ee-comment-check"> Add comment</label>
    <textarea id="ee-comment" class="dlg-comment" hidden placeholder="Comment (optional)" maxlength="500"></textarea>
    <div class="dlg-actions">
      <button type="button" class="btn" data-call="EditEntry.close">Cancel</button>
      <button type="button" class="btn btn-success" id="ee-update">Update</button>
    </div>
  </div>
  <div id="ee-cal-popup" class="mt-cal-popup" hidden></div>
</div>

<!-- Future-time error (v3-00202): state-preserving modal.
     KF-272: KanbanFlow's master (v3.md S7 / GM-083) records a titleless
     modal — just the verbatim text plus OK. The previous title here was
     a Pomb invention with no master support; the other draft's
     single-string variant cites the same v3.md S7 frame, which actually
     records the "You can not enter a time in the future" wording. -->
<div id="mt-error-overlay" class="dlg-overlay dlg-overlay-top" hidden>
  <div class="dlg dlg-error" role="alertdialog" aria-label="Error">
    <p id="mt-error-msg">You can not enter a time in the future</p>
    <div class="dlg-actions">
      <button type="button" class="btn" data-call="ManualTime.closeError">OK</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<!-- Enabled board colors for the task-modal color picker (read via dataset). -->
<div id="board-colors" hidden aria-hidden="true">
  {% for color in colors %}
  <span data-id="{{ color.id }}" data-value="{{ color.value }}" data-label="{{ color.label }}" data-default="{{ color.is_default }}" data-bg="{{ color.bg }}" data-border="{{ color.border }}" data-light="{{ color.light }}"></span>
  {% endfor %}
</div>
