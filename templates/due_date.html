{% extends "base.html" %}
{% block title %}Due date performance — ChipFlow{% endblock %}
{% block content %}
<div class="timer-page">
  <!-- KF-341: Due date performance report page. Full-page report (KanbanFlow parity:
       Due date performance is a destination in the 15-item Reports menu); how well
       tasks on the board meet their due dates. -->
  <header class="timer-page-head">
    <h1>Due date performance</h1>
    <button type="button" id="due-date-close" class="icon-btn" title="Close" aria-label="Close">&times;</button>
  </header>

  <p class="report-desc">
    How well tasks on <strong>{{ board_name }}</strong> meet their due dates.
  </p>

  <div id="due-date-summary" class="report-summary"></div>

  <table id="due-date-table" class="report-table" hidden>
    <thead>
      <tr>
        <th scope="col">Task</th>
        <th scope="col">Due date</th>
        <th scope="col">Completed</th>
        <th scope="col">Status</th>
      </tr>
    </thead>
    <tbody id="due-date-rows"></tbody>
  </table>
  <p id="due-date-status" class="log-status" role="status"></p>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () { DueDatePage.init("{{ board_id }}"); });
</script>
{% endblock %}
