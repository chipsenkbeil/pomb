<div id="wip-dialog" class="dlg-overlay dlg-overlay-wip" hidden>
  <div class="dlg dlg-light" role="alertdialog" aria-labelledby="wip-title" aria-describedby="wip-message">
    <div class="dlg-title" id="wip-title">Column is full</div>
    <p class="dlg-text" id="wip-message"></p>
    <div class="dlg-actions">
      <button type="button" class="btn" data-close-dialog>Choose another column</button>
      <button type="button" class="btn btn-danger" id="wip-force">Move anyway</button>
    </div>
  </div>
</div>
