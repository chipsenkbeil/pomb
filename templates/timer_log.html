{% extends "shell.html" %}
{% block title %}Time spent | Pomb{% endblock %}
{% block shell_class %} bshell-nonav{% endblock %}
{% block shell_title %}Time spent{% endblock %}
{% block shell_body %}
  <div class="kf-btn-row">
    <button type="button" id="spent-print" class="kf-btn" title="Print">Print</button>
    <span class="export-wrap">
      <button type="button" id="spent-export" class="kf-btn" title="Export">Export</button>
      <span class="menu-pop" id="spent-export-menu" hidden>
        <button type="button" data-export="excel-detailed">Excel (Detailed)</button>
        <button type="button" data-export="excel-summary">Excel (Summary)</button>
        <button type="button" data-export="pdf-summary">PDF (Summary)</button>
      </span>
    </span>
  </div>
  <!-- KF-292: KanbanFlow-style filter row — Board / Period / Entry-type dropdowns,
       always visible (replaces the old single "Filter" button + pane). -->
  <div class="settings-form field-row">
    <label>
      Board
      <select id="spent-board">
        <option value="">All boards</option>
      </select>
    </label>
    <label>
      Period
      <select id="spent-period">
        <option value="this-plus-last-week" selected>This + Last week</option>
        <option value="last-30">Last 30 days</option>
        <option value="last-7">Last 7 days</option>
        <option value="last-14">Last 14 days</option>
        <option value="this-week">This week</option>
        <option value="last-week">Last week</option>
        <option value="this-month">This month</option>
        <option value="last-month">Last month</option>
      </select>
    </label>
    <label>
      Entry type
      <select id="spent-entry-type">
        <option value="">All</option>
        <option value="tasks">Tasks</option>
        <option value="breaks">Breaks</option>
      </select>
    </label>
    <label>
      Color
      <select id="spent-color">
        <option value="">Show all</option>
      </select>
    </label>
    <div class="kf-btn-row">
      <button type="button" id="spent-reload" class="kf-btn kf-btn-success">Reload</button>
    </div>
  </div>
  <div class="settings-form field-row">
    <label>
      Group by
      <select id="spent-group">
        <option value="date-desc" selected>Date (descending)</option>
        <option value="date-asc">Date (ascending)</option>
      </select>
    </label>
    <span class="kf-btn-group" role="tablist" aria-label="View">
      <button type="button" id="spent-view-summary" class="kf-btn kf-btn-active" role="tab" data-call="TimeSpent.setView" data-call-arg="summary">Summary</button>
      <button type="button" id="spent-view-detailed" class="kf-btn" role="tab" data-call="TimeSpent.setView" data-call-arg="detailed">Detailed</button>
    </span>
  </div>
  <div class="spent-total" id="spent-total"></div>
  <div id="spent-list" class="spent-list">
    <p class="settings-hint">Loading&hellip;</p>
  </div>
  <!-- KF-393: filter bookmarks, saved in this browser; a bookmark puts
       back the Board, Period, Entry type, Color and Group by filters. -->
  <div class="spent-bookmarks settings-form">
    <button type="button" id="spent-bookmarks-toggle" class="spent-bookmarks-head" aria-expanded="false">Bookmarks (<span id="spent-bookmarks-count">0</span>)</button>
    <div id="spent-bookmarks-body" hidden>
      <ul id="spent-bookmarks-list" class="spent-bookmarks-list"></ul>
      <div class="spent-bookmarks-add">
        <input type="text" id="spent-bookmark-name" placeholder="Bookmark name" maxlength="60" autocomplete="off">
        <button type="button" id="spent-bookmark-save" class="kf-btn">Bookmark filter</button>
      </div>
    </div>
  </div>
{% endblock %}
{% block shell_scripts %}
<!-- KF-295: "Print" sheet (GM-169) — titled "Print", shows the report's task
     table, with Filter and Print buttons top-left. The sheet's Print button
     invokes the browser print with print CSS scoped to the sheet; the Filter
     button closes the sheet back to the report (Pomb's filters are the
     always-visible row on the report page, KF-292). -->
<div id="spent-print-overlay" class="spent-print-overlay" hidden>
  <div class="spent-print-sheet" role="dialog" aria-modal="true" aria-label="Print">
    <header class="spent-print-head">
      <h2>Print</h2>
    </header>
    <div class="spent-print-btns">
      <button type="button" id="spent-print-filter" class="kf-btn" title="Filter">Filter</button>
      <button type="button" id="spent-print-do" class="kf-btn" title="Print">Print</button>
    </div>
    <div id="spent-print-body" class="spent-print-body"></div>
  </div>
</div>
{% endblock %}
