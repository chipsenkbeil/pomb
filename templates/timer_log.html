{% extends "base.html" %}
{% block title %}Time spent — ChipFlow{% endblock %}
{% block content %}
<div class="timer-page">
  <!-- KF-286: standalone Time spent report page. Title "Time spent"; top-left
       Filter / Print / Export buttons; close × back to the board.
       (The timer log itself is now a modal on the board page.) -->
  <header class="timer-page-head">
    <h1>Time spent</h1>
    <button type="button" id="spent-close" class="icon-btn" title="Close" aria-label="Close">&times;</button>
  </header>
  <div class="spent-head">
    <div class="spent-head-btns">
      <button type="button" id="spent-filter-btn" class="btn btn-sm">Filter</button>
      <button type="button" id="spent-print" class="btn btn-sm" title="Print">&#128438; Print</button>
      <button type="button" id="spent-export" class="btn btn-sm" title="Export">&#8681; Export</button>
    </div>
  </div>
  <div id="spent-filter-pane" class="spent-filter-pane" hidden>
    <label>
      Period
      <select id="spent-period">
        <option value="last-30" selected>Last 30 days</option>
        <option value="last-7">Last 7 days</option>
        <option value="last-14">Last 14 days</option>
        <option value="this-week">This week</option>
        <option value="last-week">Last week</option>
        <option value="this-month">This month</option>
        <option value="last-month">Last month</option>
      </select>
    </label>
    <label>
      User
      <select id="spent-user" disabled>
        <option>{{ username }}</option>
      </select>
    </label>
    <label>
      Color
      <select id="spent-color">
        <option value="">Show all</option>
      </select>
    </label>
    <label>
      Label
      <span class="spent-label-row">
        <input type="text" id="spent-label" placeholder="Add labels&hellip;" disabled>
        <button type="button" class="icon-btn" id="spent-label-clear" title="Clear" aria-label="Clear">&times;</button>
      </span>
    </label>
    <button type="button" id="spent-reload" class="btn btn-sm btn-success">Reload</button>
  </div>
  <div class="spent-controls">
    <label>
      Group by
      <select id="spent-group">
        <option value="date-desc" selected>Date (descending)</option>
        <option value="date-asc">Date (ascending)</option>
      </select>
    </label>
    <span class="spent-view-toggle" role="tablist" aria-label="View">
      <button type="button" id="spent-view-summary" class="timer-tab active" role="tab" onclick="TimeSpent.setView('summary')">Summary</button>
      <button type="button" id="spent-view-detailed" class="timer-tab" role="tab" onclick="TimeSpent.setView('detailed')">Detailed</button>
    </span>
  </div>
  <div class="spent-total" id="spent-total"></div>
  <div id="spent-list" class="spent-list">
    <p class="log-status">Loading&hellip;</p>
  </div>
  <div class="spent-bookmarks">Bookmarks (0)</div>
</div>
{% endblock %}
