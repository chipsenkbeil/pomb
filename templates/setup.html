{% extends "base.html" %}
{% block title %}Set up Pomb{% endblock %}
{% block content %}
<main class="login-page">
  <div class="login-card">
    <h1>&#127813; Pomb</h1>
    <p class="setup-intro">Welcome! Create your admin account to get started.</p>
    {% if let Some(error) = error %}<p class="login-error">{{ error }}</p>{% endif %}
    <form method="post" action="/setup">
      <label>Username
        <input type="text" name="username" required autocomplete="username" autofocus maxlength="100">
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="new-password" minlength="8">
      </label>
      <label>Confirm password
        <input type="password" name="confirm" required autocomplete="new-password" minlength="8">
      </label>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>
  </div>
</main>
{% endblock %}
