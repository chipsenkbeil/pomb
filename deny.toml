[advisories]
yanked = "deny"
unmaintained = "all"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

# --- project-specific entries below (dev sync keeps them) ---

[[bans.deny]]
crate = "openssl-sys"
reason = "C code; the project is pure Rust"

[[bans.deny]]
crate = "ring"
reason = "C and assembly; the project is pure Rust"

[[bans.deny]]
crate = "aws-lc-sys"
reason = "C code; the project is pure Rust"

[[bans.deny]]
crate = "aws-lc-rs"
reason = "wraps aws-lc-sys, which is C code"

[[advisories.ignore]]
id = "RUSTSEC-2023-0071"
reason = "rsa 0.10.0-rc.19 reaches pomb only through crypto-glue 0.2.2, which webauthn-rs-core 0.6.2 and webauthn-attestation-ca 0.6.2 use to verify RS256 passkey signatures with public keys; the Marvin timing attack needs a private-key decryption or signature, and pomb holds no RSA private key"
