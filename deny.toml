[advisories]
yanked = "deny"
unmaintained = "all"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

# --- project-specific entries below (dev sync keeps them) ---

[[bans.deny]]
crate = "openssl-sys"
reason = "C code; the project is pure Rust"

[[bans.deny]]
crate = "ring"
reason = "C and assembly; the project is pure Rust"

[[bans.deny]]
crate = "aws-lc-sys"
reason = "C code; the project is pure Rust"

[[bans.deny]]
crate = "aws-lc-rs"
reason = "wraps aws-lc-sys, which is C code"

[[advisories.ignore]]
id = "RUSTSEC-2023-0071"
reason = "rsa reaches pomb only through webauthn-rs, which verifies RS256 passkey signatures with public keys; the Marvin timing attack needs a private-key decryption or signature, and pomb holds no RSA private key"

[[advisories.ignore]]
id = "RUSTSEC-2026-0387"
reason = "crypto-bigint 0.5 reaches pomb only through webauthn-rs's elliptic-curve 0.13, which pomb uses to verify passkey signatures; every value in that arithmetic is public, so its timing leaks no secret, and no 0.5 release has the fix"
