id: js-trailing-comma
valid:
  - |
    var a = {
      x: 1,
      y: 2,
    };
  - |
    var a = {
      x: 1,
      // note
    };
  - |
    var a = [
      1,
      ...rest,
    ];
  - |
    var a = { x: 1, y: [1, 2] };
invalid:
  - |
    var a = {
      x: 1,
      y: 2
    };
  - |
    var a = {
      x: 1 // note
    };
  - |
    var a = [
      1,
      ...rest
    ];
