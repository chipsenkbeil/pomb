[package]
name = "chipflow"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[workspace.lints.rust]
warnings = "deny"                        # Tooling: deny warnings at every stage
missing_debug_implementations = "deny"   # Derives: give a public type Debug
elided_lifetimes_in_paths = "deny"       # Generics: write '_ for an opaque borrow

[workspace.lints.clippy]
mod_module_files = "deny"                  # Naming: no mod.rs outside tests/
unwrap_used = "deny"                       # Errors: unwrap only in tests
undocumented_unsafe_blocks = "deny"        # Unsafe: SAFETY comment above each block
# missing_errors_doc and missing_panics_doc apply to library-register crates only, as a
# crate-root attribute in each published crate's lib.rs.
missing_safety_doc = "deny"                # Rustdoc: # Safety section
return_self_not_must_use = "deny"          # Derives: must_use on builder setters
double_must_use = "deny"                   # Derives: no must_use on a must_use return type
must_use_unit = "deny"                     # Derives: no must_use on a unit function
struct_excessive_bools = "deny"            # Signatures: a mode is an enum
fn_params_excessive_bools = "deny"         # Signatures: a mode is an enum
non_std_lazy_statics = "deny"              # Constants: LazyLock, not once_cell
items_after_test_module = "deny"           # Testing: tests module at the bottom
needless_lifetimes = "deny"                # Generics: elide lifetimes
multiple_unsafe_ops_per_block = "deny"     # Unsafe: one operation per block
allow_attributes = "deny"                  # Tooling: #[expect], never #[allow]
allow_attributes_without_reason = "deny"   # Tooling: every #[expect] has a reason
wrong_self_convention = "deny"             # Naming: as_, to_, into_, is_ by ownership
io_other_error = "deny"                    # Errors: io::Error::other, not ErrorKind::Other
disallowed_methods = "deny"                # Errors: clippy.toml bans io::Error::other
disallowed_types = "deny"                  # Tooling: clippy.toml type bans

wildcard_imports = "allow"        # Modules: globs of preludes and the domain module are allowed
module_name_repetitions = "allow" # Naming: single-crate types carry their module path prefix
must_use_candidate = "allow"      # Derives: flags nearly everything, must_use is judged by hand

[dependencies]
argon2 = "0.5"
askama = "0.12"
askama_axum = "0.4"
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
rand = "0.8"
redb = "4"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
utoipa = "5"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
chrono-tz = "0.10"
tempfile = "3.27.0"

[lints]
workspace = true

# KF-484: unoptimised Argon2 makes every debug-build login test cost seconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
